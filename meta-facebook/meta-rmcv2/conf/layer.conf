# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "fb-rmcv2-layer"
BBFILE_PATTERN_fb-rmcv2-layer := "^${LAYERDIR}/"

LAYERSERIES_COMPAT_fb-rmcv2-layer := "walnascar styhead scarthgap nanbield kirkstone"
